name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test step diffs against the base branch to pick the packages it runs.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not the 22 `engines` allows: server/sessions.ts unrefs its budget timer, which on 22 drains the test runner's event loop and cancels server/upgrade.test.ts.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # A file outside every package, such as the lockfile, the shared tsconfig or this workflow, can change any package's result.
          if git diff --name-only "$BASE_REF" HEAD | grep -qvE '^(apps|plugins)/'; then
            pnpm test
          else
            pnpm --filter "...[$BASE_REF]" test
          fi
