name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release plugins
    runs-on: ubuntu-latest
    # A fork's pushes to main would open release pull requests for releases nobody there is going to cut.
    if: github.repository == 'sleeyax/paseo-plugins'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release pull request or GitHub releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
